<!DOCTYPE html>
<html lang="ru">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ежедневный отчет</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --topbar: #171b24;
      --topbar-text: #ffffff;
      --surface: #ffffff;
      --surface-muted: #f1f5f9;
      --border: #e2e8f0;
      --text: #111827;
      --muted: #64748b;
      --input: #f8fafc;
      --shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
      --danger: #ef4444;
      --accent: #3b82f6;
    }

    body.theme-dark {
      --bg: #121826;
      --topbar: #0b1020;
      --topbar-text: #e5e7eb;
      --surface: #1e293b;
      --surface-muted: #273449;
      --border: #334155;
      --text: #f8fafc;
      --muted: #a5b4c8;
      --input: #111827;
      --shadow: 0 16px 44px rgba(0, 0, 0, 0.28);
      --danger: #fb7185;
      --accent: #60a5fa;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: var(--text);
      background: var(--bg);
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
      font-weight: 700;
    }

    button:disabled,
    input:disabled,
    select:disabled {
      cursor: not-allowed;
      opacity: 0.6;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 54px;
      padding: 10px 16px;
      color: var(--topbar-text);
      background: var(--topbar);
    }

    .brand {
      color: #38bdf8;
      font-size: 18px;
      font-weight: 900;
      white-space: nowrap;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .employee-select {
      min-width: 220px;
      max-width: 280px;
      border: 1px solid rgba(148, 163, 184, 0.34);
      border-radius: 10px;
      padding: 8px 10px;
      color: var(--topbar-text);
      background: rgba(255, 255, 255, 0.08);
      outline: none;
    }

    .theme-button {
      width: 38px;
      height: 34px;
      border-radius: 10px;
      color: var(--topbar-text);
      background: rgba(255, 255, 255, 0.08);
    }

    .theme-button:hover,
    .employee-select:focus {
      box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.28);
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .filter-button {
      border-radius: 999px;
      padding: 9px 14px;
      color: #ffffff;
      background: var(--type-color, var(--accent));
      opacity: 0.42;
      transition: opacity 0.15s ease, transform 0.15s ease;
    }

    .filter-button:hover {
      transform: translateY(-1px);
    }

    .filter-button.is-active {
      opacity: 1;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      min-height: calc(100vh - 108px);
      background: var(--surface);
    }

    .column {
      min-height: 420px;
      border-right: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }

    .column-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 14px 16px 12px;
      border-bottom: 3px solid var(--type-color, var(--accent));
      background: linear-gradient(135deg, var(--type-bg, rgba(59, 130, 246, 0.12)), transparent 90%);
    }

    .column-title {
      margin: 0;
      font-size: 16px;
      font-weight: 900;
    }

    .counter {
      min-width: 28px;
      height: 28px;
      padding: 6px 8px;
      border-radius: 999px;
      color: #ffffff;
      background: var(--type-color, var(--accent));
      font-size: 13px;
      line-height: 16px;
      text-align: center;
      font-weight: 900;
    }

    .add-form {
      position: relative;
      padding: 10px 8px;
      border-bottom: 1px solid var(--border);
    }

    .add-input {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 42px 10px 12px;
      color: var(--text);
      background: var(--input);
      outline: none;
    }

    .add-input:focus {
      border-color: var(--type-color, var(--accent));
      box-shadow: 0 0 0 3px var(--type-focus, rgba(59, 130, 246, 0.18));
    }

    .add-button {
      position: absolute;
      top: 16px;
      right: 14px;
      width: 30px;
      height: 30px;
      border-radius: 7px;
      color: #ffffff;
      background: var(--type-color, var(--accent));
      font-size: 20px;
      line-height: 28px;
    }

    .entries {
      display: grid;
      gap: 8px;
      padding: 10px 8px 18px;
    }

    .entry {
      position: relative;
      padding: 10px 38px 10px 10px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface-muted);
      overflow-wrap: anywhere;
    }

    .entry-data {
      margin-bottom: 5px;
      white-space: pre-wrap;
      font-weight: 800;
      line-height: 1.35;
    }

    .entry-meta {
      color: var(--muted);
      font-size: 12px;
    }

    .delete-button {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      color: #ffffff;
      background: var(--danger);
      font-size: 16px;
      line-height: 22px;
    }

    .toast {
      position: fixed;
      right: 16px;
      bottom: 16px;
      z-index: 20;
      max-width: min(420px, calc(100vw - 32px));
      padding: 12px 14px;
      border-radius: 12px;
      color: #ffffff;
      background: #16a34a;
      box-shadow: var(--shadow);
      transform: translateY(16px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .toast.is-visible {
      transform: translateY(0);
      opacity: 1;
    }

    .toast.is-error {
      background: #dc2626;
    }

    .toast.is-busy {
      background: #d97706;
    }

    @media (max-width: 720px) {
      .topbar {
        align-items: stretch;
        flex-direction: column;
      }

      .top-actions,
      .employee-select {
        width: 100%;
      }

      .employee-select {
        max-width: none;
      }

      .board {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">Ежедневный отчет</div>
    <div class="top-actions">
      <select id="employeeSelect" class="employee-select" aria-label="Сотрудник">
        <option value="">Загрузка...</option>
      </select>
      <button type="button" id="themeButton" class="theme-button" aria-label="Переключить тему">☾</button>
    </div>
  </header>

  <nav id="visibilityFilters" class="filters" aria-label="Видимость категорий"></nav>
  <main id="board" class="board" aria-live="polite"></main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
    const EMPLOYEE_STORAGE_KEY = 'dailyReport.selectedEmployee';
    const VISIBLE_ACTIONS_STORAGE_KEY = 'dailyReport.visibleActionTypes';
    const THEME_STORAGE_KEY = 'dailyReport.theme';

    const TYPE_COLORS = [
      '#4f6bed',
      '#ef4444',
      '#14b8a6',
      '#f59e0b',
      '#8b5cf6',
      '#06b6d4',
      '#f97316',
      '#22c55e',
      '#ec4899',
      '#64748b'
    ];

    const state = {
      employees: [],
      actionTypes: [],
      entries: [],
      visibleActionTypes: []
    };

    const board = document.getElementById('board');
    const employeeSelect = document.getElementById('employeeSelect');
    const visibilityFilters = document.getElementById('visibilityFilters');
    const themeButton = document.getElementById('themeButton');
    const toast = document.getElementById('toast');
    let toastTimer = null;

    document.addEventListener('DOMContentLoaded', function() {
      applySavedTheme();
      loadInitialData();
    });
    employeeSelect.addEventListener('change', saveSelectedEmployee);
    themeButton.addEventListener('click', toggleTheme);

    function loadInitialData() {
      showToast('Загрузка...', 'busy');

      google.script.run
        .withSuccessHandler(function(data) {
          state.employees = data.employees || [];
          state.actionTypes = data.actionTypes || [];
          state.entries = data.entries || [];
          state.visibleActionTypes = getSavedVisibleActionTypes(state.actionTypes);
          renderEmployeeSelect();
          renderVisibilityFilters();
          renderBoard();
          showToast('Готово');
        })
        .withFailureHandler(handleError)
        .getInitialData();
    }

    function renderEmployeeSelect() {
      const savedEmployee = localStorage.getItem(EMPLOYEE_STORAGE_KEY) || '';
      employeeSelect.innerHTML = '<option value="">Сотрудник</option>';

      state.employees.forEach(function(employee) {
        const option = document.createElement('option');
        option.value = employee;
        option.textContent = employee;
        employeeSelect.appendChild(option);
      });

      if (state.employees.indexOf(savedEmployee) !== -1) {
        employeeSelect.value = savedEmployee;
      }
    }

    function renderVisibilityFilters() {
      visibilityFilters.innerHTML = '';

      state.actionTypes.forEach(function(actionType, index) {
        const button = document.createElement('button');
        const isVisible = state.visibleActionTypes.indexOf(actionType) !== -1;
        button.type = 'button';
        button.className = 'filter-button' + (isVisible ? ' is-active' : '');
        button.textContent = actionType;
        button.style.setProperty('--type-color', getTypeColor(index));
        button.addEventListener('click', function() {
          toggleActionType(actionType);
        });
        visibilityFilters.appendChild(button);
      });
    }

    function renderBoard() {
      board.innerHTML = '';

      state.visibleActionTypes.forEach(function(actionType) {
        board.appendChild(createColumn(actionType));
      });
    }

    function createColumn(actionType) {
      const columnEntries = state.entries.filter(function(entry) {
        return entry.actionType === actionType;
      });
      const typeIndex = state.actionTypes.indexOf(actionType);

      const column = document.createElement('section');
      column.className = 'column';
      setTypeStyles(column, typeIndex);

      const header = document.createElement('div');
      header.className = 'column-header';

      const title = document.createElement('h2');
      title.className = 'column-title';
      title.textContent = actionType;

      const counter = document.createElement('span');
      counter.className = 'counter';
      counter.textContent = columnEntries.length;

      header.appendChild(title);
      header.appendChild(counter);

      const form = document.createElement('form');
      form.className = 'add-form';
      form.addEventListener('submit', function(event) {
        event.preventDefault();
        addEntry(actionType, input);
      });

      const input = document.createElement('input');
      input.type = 'text';
      input.className = 'add-input';
      input.placeholder = 'Введите данные';
      input.autocomplete = 'off';

      const button = document.createElement('button');
      button.type = 'submit';
      button.className = 'add-button';
      button.textContent = '+';
      button.setAttribute('aria-label', 'Добавить запись в ' + actionType);

      form.appendChild(input);
      form.appendChild(button);

      const entries = document.createElement('div');
      entries.className = 'entries';

      columnEntries.forEach(function(entry) {
        entries.appendChild(createEntryCard(entry));
      });

      column.appendChild(header);
      column.appendChild(form);
      column.appendChild(entries);

      return column;
    }

    function createEntryCard(entry) {
      const card = document.createElement('div');
      card.className = 'entry';

      const data = document.createElement('div');
      data.className = 'entry-data';
      data.textContent = entry.data;

      const meta = document.createElement('div');
      meta.className = 'entry-meta';
      meta.textContent = entry.employee + ' · ' + entry.time;

      const deleteButton = document.createElement('button');
      deleteButton.type = 'button';
      deleteButton.className = 'delete-button';
      deleteButton.textContent = '×';
      deleteButton.setAttribute('aria-label', 'Удалить запись');
      deleteButton.addEventListener('click', function() {
        deleteEntry(entry.id);
      });

      card.appendChild(data);
      card.appendChild(meta);
      card.appendChild(deleteButton);

      return card;
    }

    function addEntry(actionType, input) {
      const employee = employeeSelect.value;
      const data = input.value.trim();

      if (!employee) {
        showToast('Выберите сотрудника', 'error');
        employeeSelect.focus();
        return;
      }

      if (!data) {
        showToast('Введите данные', 'error');
        input.focus();
        return;
      }

      saveSelectedEmployee(false);
      setFormDisabled(true);
      showToast('Добавляю...', 'busy');

      google.script.run
        .withSuccessHandler(function(entry) {
          state.entries.push(entry);
          input.value = '';
          renderBoard();
          setFormDisabled(false);
          showToast('Готово');
        })
        .withFailureHandler(function(error) {
          setFormDisabled(false);
          handleError(error);
        })
        .addEntry({
          employee: employee,
          actionType: actionType,
          data: data
        });
    }

    function deleteEntry(id) {
      if (!id) {
        showToast('Нет ID записи', 'error');
        return;
      }

      if (!confirm('Удалить эту запись?')) {
        return;
      }

      setFormDisabled(true);
      showToast('Удаляю...', 'busy');

      google.script.run
        .withSuccessHandler(function(entries) {
          state.entries = entries || [];
          renderBoard();
          setFormDisabled(false);
          showToast('Готово');
        })
        .withFailureHandler(function(error) {
          setFormDisabled(false);
          handleError(error);
        })
        .deleteEntry(id);
    }

    function saveSelectedEmployee(shouldNotify) {
      if (employeeSelect.value) {
        localStorage.setItem(EMPLOYEE_STORAGE_KEY, employeeSelect.value);
        if (shouldNotify !== false) {
          showToast('Сотрудник сохранен');
        }
      } else {
        localStorage.removeItem(EMPLOYEE_STORAGE_KEY);
      }
    }

    function getSavedVisibleActionTypes(actionTypes) {
      const saved = localStorage.getItem(VISIBLE_ACTIONS_STORAGE_KEY);

      if (!saved) {
        return actionTypes.slice();
      }

      try {
        const parsed = JSON.parse(saved);
        return parsed.filter(function(actionType) {
          return actionTypes.indexOf(actionType) !== -1;
        });
      } catch (error) {
        localStorage.removeItem(VISIBLE_ACTIONS_STORAGE_KEY);
        return actionTypes.slice();
      }
    }

    function toggleActionType(actionType) {
      const isVisible = state.visibleActionTypes.indexOf(actionType) !== -1;

      if (isVisible) {
        state.visibleActionTypes = state.visibleActionTypes.filter(function(type) {
          return type !== actionType;
        });
      } else {
        state.visibleActionTypes.push(actionType);
        sortVisibleActionTypes();
      }

      saveVisibleActionTypes();
      renderVisibilityFilters();
      renderBoard();
    }

    function sortVisibleActionTypes() {
      state.visibleActionTypes.sort(function(first, second) {
        return state.actionTypes.indexOf(first) - state.actionTypes.indexOf(second);
      });
    }

    function saveVisibleActionTypes() {
      localStorage.setItem(VISIBLE_ACTIONS_STORAGE_KEY, JSON.stringify(state.visibleActionTypes));
    }

    function applySavedTheme() {
      const savedTheme = localStorage.getItem(THEME_STORAGE_KEY) || 'dark';
      document.body.classList.toggle('theme-dark', savedTheme === 'dark');
      themeButton.textContent = savedTheme === 'dark' ? '☀' : '☾';
      themeButton.setAttribute('aria-label', savedTheme === 'dark' ? 'Включить светлую тему' : 'Включить темную тему');
    }

    function toggleTheme() {
      const nextTheme = document.body.classList.contains('theme-dark') ? 'light' : 'dark';
      localStorage.setItem(THEME_STORAGE_KEY, nextTheme);
      applySavedTheme();
    }

    function setTypeStyles(element, index) {
      const color = getTypeColor(index);
      element.style.setProperty('--type-color', color);
      element.style.setProperty('--type-bg', hexToRgba(color, document.body.classList.contains('theme-dark') ? 0.18 : 0.12));
      element.style.setProperty('--type-focus', hexToRgba(color, 0.18));
    }

    function getTypeColor(index) {
      return TYPE_COLORS[Math.max(index, 0) % TYPE_COLORS.length];
    }

    function hexToRgba(hex, alpha) {
      const normalized = hex.replace('#', '');
      const red = parseInt(normalized.slice(0, 2), 16);
      const green = parseInt(normalized.slice(2, 4), 16);
      const blue = parseInt(normalized.slice(4, 6), 16);
      return 'rgba(' + red + ', ' + green + ', ' + blue + ', ' + alpha + ')';
    }

    function setFormDisabled(disabled) {
      document.querySelectorAll('input, button, select').forEach(function(element) {
        element.disabled = disabled;
      });
    }

    function showToast(message, type) {
      window.clearTimeout(toastTimer);
      toast.textContent = message;
      toast.className = 'toast is-visible' + (type ? ' is-' + type : '');

      if (type !== 'busy') {
        toastTimer = window.setTimeout(function() {
          toast.className = 'toast';
        }, 2200);
      }
    }

    function handleError(error) {
      const message = error && error.message ? error.message : String(error || 'Неизвестная ошибка');
      showToast(message, 'error');
    }
  </script>
</body>
</html>
